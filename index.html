<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Core Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0c0c;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Window container mimicking the GUI */
        .server-window {
            background-color: #1e1e1e;
            border: 2px solid #3a3a3a;
            border-radius: 6px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        /* Top window bar */
        .window-header {
            background-color: #2d2d2d;
            padding: 10px 15px;
            font-size: 13px;
            border-bottom: 1px solid #3a3a3a;
            color: #b0b0b0;
        }

        /* Main GUI layout splits into top and bottom sections */
        .window-body {
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media(min-width: 768px) {
            .window-body {
                grid-template-columns: 320px 1fr;
            }
        }

        /* Left side elements */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        fieldset {
            border: 1px solid #444;
            border-radius: 4px;
            padding: 12px;
            background-color: #151515;
        }

        legend {
            font-size: 12px;
            font-weight: bold;
            color: #4da6ff;
            padding: 0 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat-item {
            background: #222;
            padding: 6px;
            border-radius: 3px;
            border-left: 3px solid #4da6ff;
        }

        .player-list {
            height: 180px;
            overflow-y: auto;
            font-size: 13px;
            list-style: none;
        }

        .player-list li {
            padding: 4px 0;
            border-bottom: 1px solid #222;
            color: #a0a0a0;
        }

        /* Right side scrolling log */
        .log-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .console-log {
            background-color: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
            height: 360px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
            color: #33ff33; /* Classic hacker green text */
        }

        .log-entry {
            margin-bottom: 4px;
            word-break: break-all;
        }

        .log-timestamp {
            color: #888;
        }

        .log-info {
            color: #4da6ff;
        }
    </style>
</head>
<body>

<div class="server-window">
    <div class="window-header">📡 System Core Terminal v4.2.1-STABLE</div>
    
    <div class="window-body">
        <div class="left-panel">
            <fieldset>
                <legend>Telemetry Stats</legend>
                <div class="stats-grid">
                    <div class="stat-item">CPU: <span id="cpu-val">0%</span></div>
                    <div class="stat-item">RAM: <span id="ram-val">0%</span></div>
                    <div class="stat-item">Net In: <span id="net-in">0kb/s</span></div>
                    <div class="stat-item">Net Out: <span id="net-out">0kb/s</span></div>
                </div>
                <div style="font-size: 12px; color: #888; margin-top: 5px;">
                    Uptime: <span id="uptime">0s</span>
                </div>
            </fieldset>

            <fieldset style="flex-grow: 1;">
                <legend>Active Nodes Connected</legend>
                <ul class="player-list" id="nodes-list">
                    <li>🟢 US-East-Gate_01</li>
                    <li>🟢 EU-West-Gate_04</li>
                </ul>
            </fieldset>
        </div>

        <div class="log-panel">
            <fieldset style="height: 100%;">
                <legend>Log and Network Stream</legend>
                <div class="console-log" id="console-output"></div>
            </fieldset>
        </div>
    </div>
</div>

<script>
    const consoleOutput = document.getElementById('console-output');
    const nodesList = document.getElementById('nodes-list');
    
    // Random events to make the log chaotic and interesting
    const logEvents = [
        "Incoming packet handshake completed.",
        "Scraping proxy matrix nodes...",
        "Database optimization query completed successfully.",
        "Port scan detected from IP 192.168.1.105 (Blocked).",
        "Clearing cache buffers... 412MB released.",
        "Syncing block headers with main branch.",
        "API Request: GET /api/v2/telemetry - 200 OK",
        "Warning: Minor latency spike detected in EU node."
    ];

    const targetNodes = ["Asia-South_09", "UK-North_02", "BR-East_07", "CA-Central_01"];

    function addLog(text, type = "INFO") {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];
        
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="log-timestamp">[${timeStr}]</span> <span class="log-info">[${type}]</span>: ${text}`;
        
        consoleOutput.appendChild(entry);
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    // Initialize with a few startup logs
    addLog("System initialized.");
    addLog("Establishing connection protocol...");

    // Live Loop updating stats and rolling logs dynamically
    let seconds = 0;
    setInterval(() => {
        seconds++;
        document.getElementById('uptime').innerText = seconds + 's';
        
        // Randomize the stats grid
        document.getElementById('cpu-val').innerText = Math.floor(Math.random() * 35 + 15) + '%';
        document.getElementById('ram-val').innerText = Math.floor(Math.random() * 10 + 62) + '%';
        document.getElementById('net-in').innerText = Math.floor(Math.random() * 500 + 50) + 'kb/s';
        document.getElementById('net-out').innerText = Math.floor(Math.random() * 200 + 20) + 'kb/s';

        // 30% chance to drop a random log event every iteration
        if(Math.random() < 0.4) {
            const randomMsg = logEvents[Math.floor(Math.random() * logEvents.length)];
            addLog(randomMsg);
        }

        // Randomly add/remove nodes from the list so it moves
        if(Math.random() < 0.1 && nodesList.children.length < 6) {
            const newNode = targetNodes[Math.floor(Math.random() * targetNodes.length)];
            if (!document.getElementById(newNode)) {
                const li = document.createElement('li');
                li.id = newNode;
                li.innerHTML = `🟢 ${newNode}`;
                nodesList.appendChild(li);
                addLog(`Node connected: ${newNode}`, "CONN");
            }
        } else if(Math.random() < 0.1 && nodesList.children.length > 2) {
            const childToRemove = nodesList.children[nodesList.children.length - 1];
            addLog(`Node disconnected: ${childToRemove.innerText.replace('🟢 ', '')}`, "DISC");
            nodesList.removeChild(childToRemove);
        }

    }, 1500);
</script>

</body>
</html>
